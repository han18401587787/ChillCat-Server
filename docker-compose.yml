version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_MODE=debug
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=chillcat
      - DB_PASSWORD=chillcat_pass
      - DB_NAME=chillcat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=chillcat-jwt-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    networks:
      - chillcat-network

  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chillcat
      - POSTGRES_PASSWORD=chillcat_pass
      - POSTGRES_DB=chillcat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chillcat"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - chillcat-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always
    networks:
      - chillcat-network

volumes:
  pgdata:
  redisdata:

networks:
  chillcat-network:
    driver: bridge
