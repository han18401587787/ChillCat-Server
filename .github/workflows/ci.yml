name: ChillCat Server CI

on:
  push:
    branches: [main, develop, v3.0-dev]
  pull_request:
    branches: [main, v3.0-dev]
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00

jobs:
  # =============================================
  # Go 测试 + Lint
  # =============================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chillcat
          POSTGRES_PASSWORD: chillcat
          POSTGRES_DB: chillcat_test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -count=1 -race -json > test-results.json
        env:
          DB_HOST: localhost
          DB_USER: chillcat
          DB_PASSWORD: chillcat
          DB_NAME: chillcat_test
          REDIS_HOST: localhost
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: test-results.json
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  # =============================================
  # Docker 构建
  # =============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t chillcat-server .

  # =============================================
  # 自动部署到云服务器
  # =============================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/v3.0-dev' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "========================================="
            echo "🚀 开始部署 ChillCat Server"
            echo "========================================="

            cd ~/ChillCat-Server

            # ---------- Git 同步 ----------
            echo ""
            echo "📦 [1/5] Git 同步代码..."
            echo "  分支: ${GITHUB_REF#refs/heads}"
            echo "  提交: $GITHUB_SHA"
            git fetch origin
            git checkout ${GITHUB_REF#refs/heads}
            git pull origin ${GITHUB_REF#refs/heads}
            echo "  当前 HEAD: $(git rev-parse --short HEAD)"
            echo "✅ Git 同步完成"

            # ---------- Docker 构建 ----------
            echo ""
            echo "🐳 [2/5] Docker 构建 & 启动..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans 2>&1 | while read line; do echo "  $line"; done
            echo "✅ Docker 启动完成"

            # ---------- 容器状态 ----------
            echo ""
            echo "📋 [3/5] 容器状态..."
            docker compose -f docker-compose.prod.yml ps

            # ---------- 数据库检查 ----------
            echo ""
            echo "🗄️  [4/5] 数据库连接检查..."
            if docker compose -f docker-compose.prod.yml exec -T postgres pg_isready -U chillcat 2>/dev/null; then
              echo "✅ PostgreSQL 就绪"
            else
              echo "⚠️  PostgreSQL 状态异常"
            fi

            # ---------- 健康检查 ----------
            echo ""
            echo "💚 [5/5] 服务健康检查..."
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null || echo "000")
              echo "  尝试 $i/12 → HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo ""
                echo "========================================="
                echo "✅ 部署成功！"
                echo "========================================="
                exit 0
              fi
            done

            # ---------- 失败诊断 ----------
            echo ""
            echo "========================================="
            echo "❌ 健康检查失败 - 开始诊断"
            echo "========================================="
            echo ""
            echo "=== 容器状态 ==="
            docker compose -f docker-compose.prod.yml ps -a
            echo ""
            echo "=== 应用日志 (最近 80 行) ==="
            docker compose -f docker-compose.prod.yml logs app --tail 80 2>&1 || echo "(无应用日志)"
            echo ""
            echo "=== 数据库日志 (最近 20 行) ==="
            docker compose -f docker-compose.prod.yml logs postgres --tail 20 2>&1 || echo "(无数据库日志)"
            echo ""
            echo "=== 应用容器详情 ==="
            docker inspect chillcat-server-app-1 --format '状态: {{.State.Status}} | 退出码: {{.State.ExitCode}} | 启动时间: {{.State.StartedAt}} | 错误: {{.State.Error}}' 2>/dev/null || echo "(无法获取)"
            echo ""
            echo "========================================="
            exit 1
